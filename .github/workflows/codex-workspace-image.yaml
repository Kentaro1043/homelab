name: Build Codex workspace image

on:
  pull_request:
    paths:
      - .devcontainer/codex/**
      - .github/workflows/codex-workspace-image.yaml
  push:
    branches:
      - main
    paths:
      - .devcontainer/codex/**
      - .github/workflows/codex-workspace-image.yaml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: codex-workspace-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/codex/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/kentaro1043/homelab-codex:main
            ghcr.io/kentaro1043/homelab-codex:main-${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
