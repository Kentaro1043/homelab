---
apiVersion: v1
kind: Namespace
metadata:
  name: agent-sandbox-system
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: agent-sandbox
  namespace: agent-sandbox-system
spec:
  interval: 24h
  url: https://github.com/kubernetes-sigs/agent-sandbox
  ref:
    commit: a1a58a019a5479ec6cd77f95234927da7a1f434d
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: agent-sandbox
  namespace: agent-sandbox-system
spec:
  interval: 12h
  chart:
    spec:
      chart: ./helm
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: agent-sandbox
        namespace: agent-sandbox-system
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    namespace:
      create: false
      name: agent-sandbox-system
    image:
      tag: v0.5.0
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi
    podSecurityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
