apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes
  namespace: hermes
spec:
  # Complete secret setup and stop OpenClaw before enabling the Discord gateway.
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hermes
  template:
    metadata:
      labels:
        app: hermes
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 10000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: install-codex
          image: docker.io/library/node:26-bookworm-slim
          env:
            - name: HOME
              value: /tmp
            - name: npm_config_cache
              value: /tmp/npm-cache
          command:
            - sh
            - -ec
            - npm install --prefix /opt/codex --no-audit --no-fund @openai/codex@0.160.0
          securityContext:
            runAsNonRoot: true
            runAsUser: 10000
            runAsGroup: 10000
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: codex
              mountPath: /opt/codex
        - name: configure-hermes
          image: docker.io/library/busybox:1.38.0
          command:
            - sh
            - -ec
            - |
              mkdir -p /opt/data/workspace /opt/data/home/.codex
              cp /config/config.yaml /opt/data/config.yaml
              chown -R 10000:10000 /opt/data
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [CHOWN]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: config
              mountPath: /config
              readOnly: true
      containers:
        - name: hermes
          image: docker.io/nousresearch/hermes-agent:v2026.9.24
          args: [gateway, run]
          env:
            - name: PATH
              value: /opt/codex/node_modules/.bin:/opt/hermes/bin:/opt/hermes/.venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
            - name: CODEX_HOME
              value: /opt/data/home/.codex
            - name: DISCORD_ALLOWED_USERS
              value: "766615423453364234"
            - name: DISCORD_ALLOWED_CHANNELS
              value: "1529514412417744957"
          envFrom:
            - secretRef:
                name: hermes-secrets
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: codex
              mountPath: /opt/codex
              readOnly: true
            - name: browser-shm
              mountPath: /dev/shm
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hermes-data
        - name: codex
          emptyDir: {}
        - name: config
          configMap:
            name: hermes-config
        - name: browser-shm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
