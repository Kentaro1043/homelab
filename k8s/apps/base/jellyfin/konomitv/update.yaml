apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: konomitv
  namespace: jellyfin
spec:
  image: ghcr.io/tsukumijima/konomitv
  interval: 5m
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: konomitv
  namespace: jellyfin
spec:
  imageRepositoryRef:
    name: konomitv
  filterTags:
    pattern: '^v(?P<version>[0-9]+\.[0-9]+\.[0-9]+)$'
    extract: "$version"
  policy:
    semver:
      range: ">=0.14.0 <0.15.0"
