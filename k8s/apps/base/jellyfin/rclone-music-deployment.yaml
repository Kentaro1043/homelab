apiVersion: apps/v1
kind: Deployment
metadata:
  name: rclone-music
  namespace: jellyfin
  labels:
    app.kubernetes.io/name: rclone
    app.kubernetes.io/component: music
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rclone
      app.kubernetes.io/component: music
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rclone
        app.kubernetes.io/component: music
    spec:
      automountServiceAccountToken: false
      containers:
        - name: rclone
          image: docker.io/rclone/rclone:1.74.4 # {"$imagepolicy": "jellyfin:rclone-music"}
          imagePullPolicy: IfNotPresent
          args:
            - serve
            - webdav
            - /music
            - --addr=:8080
            - --user=$(RCLONE_USER)
            - --pass=$(RCLONE_PASS)
            - --read-only
            - --disable-zip
            - --config=/dev/null
          env:
            - name: RCLONE_USER
              valueFrom:
                secretKeyRef:
                  name: rclone-music
                  key: username
            - name: RCLONE_PASS
              valueFrom:
                secretKeyRef:
                  name: rclone-music
                  key: password
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 3
          volumeMounts:
            - name: music
              mountPath: /music
              readOnly: true
      volumes:
        - name: music
          persistentVolumeClaim:
            claimName: jellyfin-music
            readOnly: true
