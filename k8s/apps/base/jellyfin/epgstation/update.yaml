apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: epgstation
  namespace: jellyfin
spec:
  image: docker.io/l3tnun/epgstation
  interval: 5m
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: epgstation
  namespace: jellyfin
spec:
  imageRepositoryRef:
    name: epgstation
  filterTags:
    pattern: '^v(?P<version>[0-9]+\.[0-9]+\.[0-9]+)-debian$'
    extract: "$version"
  policy:
    semver:
      range: ">=2.10.0 <3.0.0"
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: epgstation-mariadb
  namespace: jellyfin
spec:
  image: docker.io/library/mariadb
  interval: 5m
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: epgstation-mariadb
  namespace: jellyfin
spec:
  imageRepositoryRef:
    name: epgstation-mariadb
  filterTags:
    pattern: '^(?P<version>11\.4\.[0-9]+)$'
    extract: "$version"
  policy:
    semver:
      range: ">=11.4.0 <11.5.0"
