---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: rclone-music
  namespace: jellyfin
spec:
  image: docker.io/rclone/rclone
  interval: 5m
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: rclone-music
  namespace: jellyfin
spec:
  imageRepositoryRef:
    name: rclone-music
  filterTags:
    pattern: '^(?P<version>[0-9]+\.[0-9]+\.[0-9]+)$'
    extract: "$version"
  policy:
    semver:
      range: ">=1.0.0"
