---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: jellyfin
  namespace: jellyfin
spec:
  interval: 24h
  url: https://jellyfin.github.io/jellyfin-helm
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyfin
  namespace: jellyfin
spec:
  interval: 12h
  chart:
    spec:
      chart: jellyfin
      version: "3.2.0"
      sourceRef:
        kind: HelmRepository
        name: jellyfin
        namespace: jellyfin
  values:
    replicaCount: 1

    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        cpu: "1"
        memory: "1Gi"

    ingress:
      enabled: true
      className: cloudflare-tunnel
      hosts:
        - host: jellyfin.kentaro1043.com
          paths:
            - path: /
              pathType: Prefix

    persistence:
      config:
        enabled: true
        accessMode: ReadWriteOnce
        size: 1Gi
        storageClass: nfs-homelab
      media:
        enabled: false

    volumes:
      - name: jellyfin-music
        persistentVolumeClaim:
          claimName: jellyfin-music
      - name: jellyfin-books
        persistentVolumeClaim:
          claimName: jellyfin-books
      - name: jellyfin-shows
        persistentVolumeClaim:
          claimName: jellyfin-shows

    volumeMounts:
      - name: jellyfin-music
        mountPath: /media/music
      - name: jellyfin-books
        mountPath: /media/books
      - name: jellyfin-shows
        mountPath: /media/shows
