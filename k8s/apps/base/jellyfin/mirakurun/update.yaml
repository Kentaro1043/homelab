apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: mirakurun
  namespace: jellyfin
spec:
  image: docker.io/chinachu/mirakurun
  interval: 5m
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: mirakurun
  namespace: jellyfin
spec:
  imageRepositoryRef:
    name: mirakurun
  filterTags:
    pattern: '^(?P<version>[0-9]+\.[0-9]+\.[0-9]+)$'
    extract: "$version"
  policy:
    semver:
      range: ">=4.1.0 <5.0.0"
