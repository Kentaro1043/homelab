apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: misskey

resources:
  - namespace.yaml
  - postgres.yaml
  - valkey.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - secrets/backup.enc.yaml

configMapGenerator:
  - name: misskey-config
    files:
      - default.yml=config/default.yml
