apiVersion: apps/v1
kind: Deployment
metadata:
  name: misskey
  namespace: misskey
  labels:
    app: misskey
spec:
  replicas: 0
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  selector:
    matchLabels:
      app: misskey
  template:
    metadata:
      labels:
        app: misskey
    spec:
      initContainers:
        - name: render-config
          image: docker.io/library/busybox:1.37.0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              set -eu

              yaml_quote() {
                printf "'%s'" "$(printf '%s' "$1" | sed "s/'/''/g")"
              }

              cat /config-source/default.yml > /config/default.yml
              {
                printf '\ndb:\n'
                printf '  host: misskey-postgres-rw\n'
                printf '  port: 5432\n'
                printf '  db: misskey\n'
                printf '  user: misskey\n'
                printf '  pass: %s\n' "$(yaml_quote "$DB_PASSWORD")"
              } >> /config/default.yml
              chmod 0444 /config/default.yml
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: misskey-postgres-app
                  key: password
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
          volumeMounts:
            - name: misskey-config-source
              mountPath: /config-source
              readOnly: true
            - name: misskey-config
              mountPath: /config
      containers:
        - name: misskey
          image: docker.io/misskey/misskey:2026.5.3
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          resources:
            limits:
              cpu: "200m"
              memory: 2Gi
            requests:
              cpu: "100m"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /api/server-info
              port: 3000
            failureThreshold: 60
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /robots.txt
              port: 3000
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/server-info
              port: 3000
            periodSeconds: 15
          volumeMounts:
            - name: misskey-config
              mountPath: /misskey/.config/default.yml
              subPath: default.yml
              readOnly: true
      volumes:
        - name: misskey-config-source
          configMap:
            name: misskey-config
        - name: misskey-config
          emptyDir: {}
