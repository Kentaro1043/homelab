apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: openclaw

resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - pvc.yaml
  - secrets/openclaw-secrets.enc.yaml
  - secrets/grafana-cloud-mcp.enc.yaml
  - update.yaml

configMapGenerator:
  - name: openclaw-config
    files:
      - config/openclaw.json
      - config/AGENTS.md
