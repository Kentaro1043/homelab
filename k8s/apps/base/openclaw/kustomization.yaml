apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: openclaw

resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - pvc.yaml
  - secrets/openclaw-secrets.enc.yaml
  - secrets/codex-auth.enc.yaml

configMapGenerator:
  - name: openclaw-config
    files:
      - config/openclaw.json
      - config/AGENTS.md
      - config/codex-config.toml
