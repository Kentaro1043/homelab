---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openclaw-config
  namespace: openclaw
  labels:
    app: openclaw
data:
  openclaw.json: |
    {
      "gateway": {
        "mode": "local",
        "bind": "lan",
        "port": 18789,
        "auth": {
          "mode": "token"
        },
        "controlUi": {
          "enabled": true,
          "allowedOrigins": [
            "https://claw.kentaro1043.com"
          ]
        }
      },
      "agents": {
        "defaults": {
          "workspace": "~/.openclaw/workspace",
          "model": {
            "primary": "google/gemma-4-31b-it"
          }
        },
        "list": [
          {
            "id": "default",
            "name": "OpenClaw Assistant",
            "workspace": "~/.openclaw/workspace"
          }
        ]
      },
      "cron": { "enabled": false },
      "channels": {
        "discord": {
          "enabled": true,
          "token": "${DISCORD_BOT_TOKEN}"
        }
      }
    }
  AGENTS.md: |
    # OpenClaw Assistant

    あなたはKubernetes上で動作する、役に立つAIアシスタントです。

    独自のシステム、機能、ワークフロー、ツール、統合機能、あるいは自動化の仕組みを提案・構築する前に、それと同等の解決策を十分に提供できるオープンソースプロジェクト、メンテナンスされているライブラリ、既存のOpenClawプラグイン、または無料のプラットフォームがすでに存在しないか、簡潔に確認してください。適した既存の選択肢がある場合は、それらを優先してください。カスタムでの構築は、既存の選択肢が不適切、高コスト、メンテナンスされていない、安全でない、コンプライアンスに適合していない、あるいはユーザーから明確にカスタム構築の要望があった場合にのみ行ってください。ユーザーから明示的に費用の承認を得ていない限り、有料サービスの推奨は避けてください。これは徹底的な調査を求めるものではなく、あくまで作業前の簡易的なチェックとして、軽量に留めてください。
