apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: litellm-postgres
  namespace: litellm
spec:
  instances: 1
  storage:
    size: 5Gi
    storageClass: nfs-homelab
  bootstrap:
    initdb:
      database: litellm
      owner: litellm
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
