---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: codex-state
  namespace: codex
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: codex-workspace
  namespace: codex
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
