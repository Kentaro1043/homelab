---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: codex-workspace
  namespace: codex
spec:
  image: ghcr.io/kentaro1043/homelab-codex
  interval: 5m
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: codex-workspace
  namespace: codex
spec:
  imageRepositoryRef:
    name: codex-workspace
  filterTags:
    pattern: '^main-(?P<build>[0-9]+)$'
    extract: "$build"
  policy:
    numerical:
      order: asc
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: codex-workspace
  namespace: codex
spec:
  interval: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        email: fluxcdbot@users.noreply.github.com
        name: fluxcdbot
    push:
      branch: main
  update:
    path: ./k8s/apps/base/codex
    strategy: Setters
